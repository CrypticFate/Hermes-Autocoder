# Telegram chat for the concierge. Use with:
#   docker compose -f compose.yaml -f compose.telegram.yaml up -d
# Adds the only egress the concierge ever gets (to reach api.telegram.org) and the bot token secret.
# Access is operator-only: set TELEGRAM_ALLOWED_USERS in .env to your numeric Telegram user id.
services:
  concierge:
    environment:
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS:?Set TELEGRAM_ALLOWED_USERS in .env to your numeric Telegram user id}
      NOTIFY_INTERVAL: ${NOTIFY_INTERVAL:-2m}
    secrets: [concierge_model_token, mcp_concierge_token, db_mem0_password, telegram_bot_token]
    networks: [control, concierge-egress]

networks:
  concierge-egress: {}

secrets:
  telegram_bot_token: {file: ./secrets/telegram_bot_token}
