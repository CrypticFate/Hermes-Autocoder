[project]
name = "hermes-autocoder"
version = "0.1.0"
description = "Durable, budgeted GitHub maintenance controller for Hermes Agent"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.16,<2",
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.11,<3",
  "pyyaml>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.16,<1",
  "uvicorn>=0.34,<1",
  "PyJWT[crypto]==2.10.1",
  "mcp>=1.20,<3",
]

[project.scripts]
autocoder = "autocoder.cli:app"
hc = "autocoder.cli:app"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/autocoder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a disposable PostgreSQL database or Docker"]

[tool.ruff]
line-length = 110
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
